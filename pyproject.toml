[project]
name = "cyberlab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=6.1.1",
    "django-bootstrap5>=26.3",
    "django-environ>=0.14.0",
    "docker>=7.2.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "rooms"
reportUnknownVariableType = false
reportUnknownMemberType = false

[tool.ruff]
target-version = "py313"
line-length = 100
force-exclude = true
extend-exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]